<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Downloader Pro | PIZXOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .btn-glow:hover { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); transform: translateY(-2px); }
    </style>
</head>
<body class="flex items-center justify-center p-6 text-white font-sans">

    <div class="glass max-w-2xl w-full p-8 shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black tracking-tighter mb-2 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                <i class="fas fa-bolt mr-2"></i>MEDIA DOWNLOADER
            </h1>
            <p class="text-slate-400">YouTube, TikTok, Instagram & More</p>
        </div>

        <div class="space-y-6">
            <div class="relative group">
                <input type="text" id="urlInput" placeholder="Tempel link video/gambar di sini..." 
                    class="w-full px-6 py-4 bg-slate-800/50 border border-slate-700 focus:border-indigo-500 outline-none rounded-2xl transition duration-300 text-lg">
                <div class="absolute inset-y-0 right-4 flex items-center text-slate-500">
                    <i class="fas fa-link"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="processDL('video', '720')" class="btn-glow flex flex-col items-center p-4 bg-indigo-600/20 hover:bg-indigo-600 border border-indigo-500/30 rounded-2xl transition group">
                    <i class="fas fa-video text-indigo-400 mb-2 group-hover:text-white transition"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">MP4 Video</span>
                </button>
                <button onclick="processDL('audio', 'best')" class="btn-glow flex flex-col items-center p-4 bg-purple-600/20 hover:bg-purple-600 border border-purple-500/30 rounded-2xl transition group">
                    <i class="fas fa-music text-purple-400 mb-2 group-hover:text-white transition"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">MP3 Audio</span>
                </button>
                <button onclick="processDL('video', '1080')" class="btn-glow flex flex-col items-center p-4 bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/30 rounded-2xl transition group">
                    <i class="fas fa-hd-circle text-emerald-400 mb-2 group-hover:text-white transition"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">HD 1080p</span>
                </button>
                <button onclick="processDL('video', 'max')" class="btn-glow flex flex-col items-center p-4 bg-pink-600/20 hover:bg-pink-600 border border-pink-500/30 rounded-2xl transition group">
                    <i class="fas fa-images text-pink-400 mb-2 group-hover:text-white transition"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">Gambar</span>
                </button>
            </div>

            <div id="loading" class="hidden text-center py-6">
                <div class="animate-spin inline-block w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full mb-3"></div>
                <p class="text-sm text-indigo-300 animate-pulse font-medium">Menghubungkan ke server...</p>
            </div>

            <div id="result" class="hidden mt-6 p-5 rounded-2xl text-center font-bold border transform transition-all duration-300">
                </div>
        </div>

        <div class="mt-10 pt-8 border-t border-slate-800 text-center">
            <div class="flex justify-center gap-8 text-slate-500 text-2xl mb-4">
                <i class="fab fa-youtube hover:text-red-500 transition cursor-pointer"></i>
                <i class="fab fa-instagram hover:text-pink-500 transition cursor-pointer"></i>
                <i class="fab fa-tiktok hover:text-white transition cursor-pointer"></i>
            </div>
            <p class="text-[10px] text-slate-600 uppercase tracking-[0.2em]">Powered by Cobalt API System</p>
        </div>
    </div>

    <script>
        async function processDL(mode, quality) {
            const url = document.getElementById('urlInput').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            if (!url) {
                alert("Paste link-nya dulu!");
                return;
            }

            loading.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        videoQuality: quality,
                        downloadMode: mode,
                        filenamePattern: 'nerdy'
                    })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect') {
                    loading.classList.add('hidden');
                    result.classList.remove('hidden');
                    result.className = "mt-6 p-5 rounded-2xl text-center font-bold border bg-emerald-500/10 border-emerald-500/50 text-emerald-400";
                    result.innerHTML = `
                        <p class="mb-3">FILE BERHASIL DIPROSES!</p>
                        <a href="${data.url}" target="_blank" class="inline-block bg-emerald-600 text-white px-8 py-3 rounded-xl hover:bg-emerald-500 transition shadow-lg shadow-emerald-900/20">
                           <i class="fas fa-download mr-2"></i>UNDUH SEKARANG
                        </a>
                    `;
                    // Otomatis buka link download
                    window.open(data.url, '_blank');
                } else {
                    throw new Error(data.text || "Gagal mengambil media. Pastikan link benar.");
                }

            } catch (err) {
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                result.className = "mt-6 p-5 rounded-2xl text-center font-bold border bg-red-500/10 border-red-500/50 text-red-400";
                result.innerText = "ERROR: " + err.message;
            }
        }
    </script>
</body>
</html>
